name: CI

# Сборка и проверки Linux-версии на каждый коммит и каждый pull request.
#
# Два задания. build — всё решение (свои проекты и общие из подмодуля
# shared/) и все проверки. package — пакет .deb тем же tools/build-deb.sh, что
# и выпуск: сломанная раскладка, служба или права всплывают здесь, а не на
# чистой машине у администратора.
#
# ubuntu-24.04, а не ubuntu-latest: Mint 22 стоит на Ubuntu 24.04 (noble), и
# пакет обязан собираться и ставиться против той же базы (docs/PORT-PLAN.md,
# «Что решено»). Переход на следующую Ubuntu — решение, а не побочный эффект
# обновления раннера.
#
# Подмодуль — Windows-репозиторий KorevaGit/Win-EliteSIP. Если он закрытый,
# стандартного токена задания на него не хватит: нужен секрет SHARED_REPO_TOKEN
# (fine-grained, Contents: read на Win-EliteSIP). Открытому хватает и без него.

on:
  push:
    branches: [main, 'linux/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.SHARED_REPO_TOKEN || github.token }}

      # Метки подмодуля нужны сборке: git describe вписывает в приложение,
      # из какого общего кода оно собрано (SupportFacts.SharedCode), и
      # проверка это сверяет. Клон подмодуля метки сам не приносит.
      - name: Метки общего кода
        run: git -C shared fetch --tags --force origin

      # Версия SDK — из global.json, та же, что на машине разработки: красный
      # прогон должен воспроизводиться у себя.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Правило подмодуля 1 (docs/PORT-PLAN.md): в shared/ ничего не правят.
      # Незакоммиченное там — это код, которого нет ни в одном репозитории.
      - name: Подмодуль без правок
        run: test -z "$(git -C shared status --porcelain)"

      - name: Восстановление
        run: dotnet restore EliteSIP.Linux.slnx

      - name: Сборка
        run: dotnet build EliteSIP.Linux.slnx --no-restore --configuration Release

      # Проверки звука без сервера, окон — на Avalonia Headless, оболочки — на
      # временных каталогах; живой сеанс им не нужен. Две проверки помечены
      # «только Windows» и честно пропускаются.
      - name: Проверки
        run: dotnet test EliteSIP.Linux.slnx --no-build --configuration Release --verbosity normal

  package:
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.SHARED_REPO_TOKEN || github.token }}

      - name: Метки общего кода
        run: git -C shared fetch --tags --force origin

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Пакет собирается с заводской настройкой-заглушкой: настоящая с паролем
      # канала в CI не попадает (сквозное правило 1, «в Git нельзя пароли»).
      # Поэтому собранный здесь пакет никуда не выкладывается — только
      # проверяется.
      - name: Пакет с заглушкой настройки
        run: |
          stub="$RUNNER_TEMP/provisioning.json"
          cat > "$stub" <<'EOF'
          {
            "updates": { "baseURL": "https://update.invalid", "user": "ci", "password": "ci" },
            "presetsPublicKey": "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=",
            "releasesPublicKey": "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          }
          EOF
          tools/build-deb.sh --version 0.0.0 --provisioning "$stub" --output "$RUNNER_TEMP/deb"

      - name: Содержимое пакета
        run: |
          package="$RUNNER_TEMP/deb/EliteSIP-0.0.0.deb"
          dpkg-deb --info "$package"
          contents=$(dpkg-deb --contents "$package")
          for path in \
              ./opt/elitesip/EliteSIP \
              ./opt/elitesip/elitesip-updater \
              ./opt/elitesip/provisioning.json \
              ./usr/lib/systemd/system/elitesip-updater.service \
              ./usr/lib/systemd/system/elitesip-updater.timer \
              ./usr/lib/systemd/system/elitesip-updater.path \
              ./usr/lib/systemd/user/elitesip.service \
              ./etc/xdg/autostart/elitesip.desktop \
              ./usr/share/doc/elitesip/copyright \
              ./usr/share/doc/elitesip/changelog.gz; do
            grep -q " $path\$" <<<"$contents" || { echo "в пакете нет $path"; exit 1; }
          done
          # Всё в пакете — root: иначе /opt/elitesip у администратора
          # оказался бы чужим каталогом, в который пишет сборщик.
          if grep -v ' root/root ' <<<"$contents"; then echo "в пакете есть файлы не root"; exit 1; fi

      # Установка на раннер — тем же apt, что у администратора на Mint 22: у
      # раннера ubuntu-24.04 есть systemd и sudo. Так проверяется то, что
      # иначе видно только на чистой машине: зависимости, postinst (каталоги
      # и их права, таймер и путь включены), службы глазами systemd и один
      # такт обновляльщика под его изоляцией (ProtectSystem=strict и др.):
      # отметки согласия нет, канал заглушки — такт обязан кончиться кодом 0.
      - name: Установка, такт обновляльщика, удаление
        run: |
          package="$RUNNER_TEMP/deb/EliteSIP-0.0.0.deb"
          sudo apt-get update -q
          sudo apt-get install -y "$package"

          check_mode() {
            actual=$(stat -c '%a %U' "$2")
            [ "$actual" = "$1 root" ] || { echo "$2: $actual, а нужно $1 root"; exit 1; }
          }
          check_mode 755 /opt/elitesip
          check_mode 755 /var/lib/elitesip
          check_mode 1777 /var/lib/elitesip/updates
          check_mode 700 /var/lib/elitesip/updater
          test -x /opt/elitesip/EliteSIP && test -x /opt/elitesip/elitesip-updater

          systemctl is-enabled elitesip-updater.timer elitesip-updater.path
          systemctl is-active elitesip-updater.timer elitesip-updater.path
          systemd-analyze verify /usr/lib/systemd/system/elitesip-updater.service \
              /usr/lib/systemd/system/elitesip-updater.timer /usr/lib/systemd/system/elitesip-updater.path

          sudo systemctl start elitesip-updater.service
          result=$(systemctl show elitesip-updater.service --property=Result --value)
          sudo journalctl -u elitesip-updater --no-pager
          [ "$result" = success ] || { echo "такт обновляльщика: $result"; exit 1; }

          # Удаление: будильники выключены, программа ушла, каталог обмена
          # остался (настройки и журнал обновляльщика уходят только с purge).
          sudo apt-get remove -y elitesip
          if systemctl is-enabled elitesip-updater.timer 2>/dev/null; then
              echo "после remove таймер обновляльщика остался включён"; exit 1
          fi
          test ! -e /opt/elitesip/EliteSIP
          test -d /var/lib/elitesip

          sudo apt-get purge -y elitesip
          test ! -e /var/lib/elitesip
